<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Excel - Pharmacie Dafeanne</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-firestore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/2.8.0/xlsx.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .container { background: #f5f5f5; padding: 30px; border-radius: 8px; }
        h1 { color: #333; text-align: center; }
        button { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 10px 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 15px; background: white; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        .loading { background: #d1ecf1; color: #0c5460; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Exporter les Données</h1>

        <div style="text-align: center;">
            <button onclick="exportFournisseurs()">🏭 Fournisseurs</button>
            <button onclick="exportCaisse()">💰 Petite Caisse</button>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAL6lB3CljO0zERddTOEbojpPmHKh2ffa4",
            authDomain: "pharmacie-dafeanne.firebaseapp.com",
            projectId: "pharmacie-dafeanne",
            storageBucket: "pharmacie-dafeanne.appspot.com",
            messagingSenderId: "462815751428",
            appId: "1:462815751428:web:4a8e6a0da5f0d3b8c2a5de"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.firestore();

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        async function exportFournisseurs() {
            try {
                showStatus('Chargement des données...', 'loading');

                const snap = await db.collection('pharmacies').doc('DAFEANNE').collection('factures').get();
                const data = snap.docs.map(doc => {
                    const f = doc.data();
                    return {
                        'Date': f.dateFacture || '',
                        'Fournisseur': f.fournisseur || '',
                        'Désignation': f.designation || '',
                        'Montant': f.montant || 0,
                        'Échéance': f.echeance || '',
                        'Mode paiement': f.modePaiement || '',
                        'Montant payé': f.montantPaye || 0,
                        'Date paiement': f.datePaye || '',
                        'N° Chèque': f.numeroCheque || '',
                        'Bénéficiaire': f.beneficiaire || 'Non défini',
                        'Statut': f.statut || '',
                        'Observations': f.note || '',
                        'Alerte jours': f.alerteJours || '',
                        'Prospective': f.prospective || ''
                    };
                });

                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Fournisseurs');
                XLSX.writeFile(wb, `FOURNISSEURS_${new Date().toISOString().slice(0,10)}.xlsx`);

                showStatus(`✅ Exporte ${data.length} facture(s)!`, 'success');
            } catch(e) {
                showStatus('❌ Erreur: ' + e.message, 'error');
            }
        }

        async function exportCaisse() {
            try {
                showStatus('Chargement des données...', 'loading');

                const snap = await db.collection('pharmacies').doc('DAFEANNE').collection('caisse').get();
                const data = snap.docs.map(doc => {
                    const op = doc.data();
                    const isRecharge = op.type === 'recharge';
                    return {
                        'Date': op.date || '',
                        'Type': isRecharge ? 'Recharge' : 'Dépense',
                        'Désignation': op.libelle || op.designation || '',
                        'Montant': (isRecharge ? '+' : '-') + (op.montant || 0),
                        'Référence transaction': op.refTransaction || '',
                        'Observations': op.note || ''
                    };
                });

                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Petite Caisse');
                XLSX.writeFile(wb, `PETITE_CAISSE_${new Date().toISOString().slice(0,10)}.xlsx`);

                showStatus(`✅ Exporte ${data.length} opération(s)!`, 'success');
            } catch(e) {
                showStatus('❌ Erreur: ' + e.message, 'error');
            }
        }
    </script>
</body>
</html>
